name: Publicar JW Hamburgueria na Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-jmhamburgueria
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JW_ADMIN_PIN: ${{ secrets.JW_ADMIN_PIN }}
      JW_SESSION_SECRET: ${{ secrets.JW_SESSION_SECRET }}
    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verificar credenciais obrigatórias
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID JW_ADMIN_PIN JW_SESSION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Falta configurar o secret ${name} nas configurações do repositório."
              exit 1
            fi
          done

      - name: Instalar ferramentas
        run: npm install --no-audit --no-fund

      - name: Gerar aplicação
        run: npm run build

      - name: Aplicar migrações no banco remoto
        run: npx wrangler d1 migrations apply jmhamburgueria-db --remote

      - name: Publicar Worker
        run: npx wrangler deploy

      - name: Configurar PIN do painel
        run: printf '%s' "$JW_ADMIN_PIN" | npx wrangler secret put ADMIN_PIN --name jmhamburgueria

      - name: Configurar segredo de sessão
        run: printf '%s' "$JW_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --name jmhamburgueria

      - name: Conferir tabelas no D1
        run: npx wrangler d1 execute jmhamburgueria-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('products','orders','order_items','settings','abandoned_carts','audit_log','site_visits') ORDER BY name;"
